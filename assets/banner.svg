<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Scanning Line Filter / Glow -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>

    <style>
      .tech-grid {
        stroke: #1e293b;
        stroke-width: 1;
        opacity: 0.45;
      }
      .laser-scan {
        animation: scanVertical 4s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pillPulse 3s ease-in-out infinite alternate;
      }
      .radar-sweep {
        transform-origin: 1040px 170px;
        animation: rotateRadar 8s linear infinite;
      }
      .orbit-particle {
        animation: orbitMotion 12s linear infinite;
      }
      .float-badge {
        animation: floatMotion 3.5s ease-in-out infinite alternate;
      }
      .hash-stream {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-size: 11px;
        fill: #38bdf8;
        opacity: 0.28;
      }

      @keyframes scanVertical {
        0% { transform: translateY(0px); opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { transform: translateY(220px); opacity: 0.3; }
      }

      @keyframes pillPulse {
        0% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.8)); }
      }

      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes floatMotion {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Geometric Grid Background Pattern -->
  <g class="tech-grid">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="110" x2="1200" y2="110" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="230" x2="1200" y2="230" />
    <line x1="0" y1="290" x2="1200" y2="290" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="260" y1="0" x2="260" y2="340" />
    <line x1="420" y1="0" x2="420" y2="340" />
    <line x1="780" y1="0" x2="780" y2="340" />
    <line x1="940" y1="0" x2="940" y2="340" />
    <line x1="1080" y1="0" x2="1080" y2="340" />
  </g>

  <!-- Hex Hashing Streams in Background -->
  <g class="hash-stream">
    <text x="50" y="35">SHA256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08</text>
    <text x="50" y="320">REALTIME_WATCHER: [IN_MODIFY | IN_ATTRIB | IN_CREATE | IN_DELETE] : VERIFIED CLEAN</text>
    <text x="680" y="35">STATUS: [200 OK] CONTINUOUS INTEGRITY ENGINE ACTIVE</text>
  </g>

  <!-- Dynamic Animated Laser Scan Line (Layered in Background) -->
  <g class="laser-scan" transform="translate(0, 50)">
    <line x1="60" y1="0" x2="1140" y2="0" stroke="url(#glowPulse)" stroke-width="2" filter="url(#laserGlow)" />
    <circle cx="600" cy="0" r="3" fill="#38bdf8" />
  </g>

  <!-- Right Decorative Radar Monitor Display -->
  <g transform="translate(1030, 170)">
    <!-- Concentric radar circles -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <circle cx="0" cy="0" r="15" fill="#0ea5e9" opacity="0.3" />
    
    <!-- Rotating Sweep Beam -->
    <g class="radar-sweep">
      <path d="M 0 0 L 85 -25 A 90 90 0 0 1 85 25 Z" fill="url(#titleGrad)" opacity="0.2" />
      <line x1="0" y1="0" x2="90" y2="0" stroke="#38bdf8" stroke-width="2" filter="url(#laserGlow)" />
    </g>

    <!-- Radar Blips -->
    <circle cx="35" cy="-25" r="3.5" fill="#4ade80" />
    <circle cx="-42" cy="30" r="3" fill="#38bdf8" />
    <circle cx="20" cy="50" r="3.5" fill="#818cf8" />
  </g>

  <!-- Foreground Content Group (Anchored clearly above all animations) -->
  <g id="foreground-content" transform="translate(70, 0)">
    
    <!-- Category & Status Badge -->
    <g class="float-badge" transform="translate(0, 55)">
      <rect width="265" height="30" rx="15" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="5" fill="#22c55e" />
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" letter-spacing="1">ENTERPRISE FIM ECOSYSTEM</text>
    </g>

    <!-- Main Shield + Lock Icon -->
    <g transform="translate(0, 102)" filter="url(#shadowFilter)">
      <path d="M 32 0 L 64 12 C 64 38 48 58 32 68 C 16 58 0 38 0 12 Z" fill="url(#shieldGrad)" />
      <!-- Lock inside shield -->
      <path d="M 24 30 L 24 25 C 24 20.5 27.5 17 32 17 C 36.5 17 40 20.5 40 25 L 40 30 L 43 30 C 44.5 30 45 31 45 32 L 45 44 C 45 45.5 44.5 46 43 46 L 21 46 C 19.5 46 19 45.5 19 44 L 19 32 C 19 31 19.5 30 21 30 Z M 27 25 L 37 25 C 37 22.2 34.8 20 32 20 C 29.2 20 27 22.2 27 25 Z" fill="#ffffff" />
    </g>

    <!-- Main Header Title -->
    <text x="80" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome File Integrity Monitoring
    </text>

    <!-- Subtitle / Tagline -->
    <text x="80" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Real-Time Change Detection • Cryptographic Baselines • Compliance &amp; Tamper Defense
    </text>

    <!-- Technology & Protocol Badges (Pills) -->
    <g class="pulse-pill" transform="translate(0, 215)">
      <!-- Pill 1: Real-time FIM -->
      <g transform="translate(0, 0)">
        <rect width="142" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">⚡ Real-Time Watch</text>
      </g>
      <!-- Pill 2: Compliance -->
      <g transform="translate(154, 0)">
        <rect width="168" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
        <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">🛡️ PCI DSS 4.0 / SOC2</text>
      </g>
      <!-- Pill 3: Self-Healing -->
      <g transform="translate(334, 0)">
        <rect width="165" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
        <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f3e8ff">🔄 Auto-Remediation</text>
      </g>
      <!-- Pill 4: Multi-Platform -->
      <g transform="translate(511, 0)">
        <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
        <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#dcfce7">🐧 Linux / Win / Cloud S3</text>
      </g>
    </g>

    <!-- Subtle Footer Highlights -->
    <text x="2" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Featuring: <tspan fill="#94a3b8">Wazuh</tspan> • <tspan fill="#94a3b8">osquery</tspan> • <tspan fill="#94a3b8">Falcon FileVantage</tspan> • <tspan fill="#94a3b8">Qualys</tspan> • <tspan fill="#94a3b8">Tripwire</tspan> • <tspan fill="#94a3b8">AIDE</tspan> • <tspan fill="#94a3b8">CimTrak</tspan>
    </text>

  </g>
</svg>
